name: 'AskISO ISO 20022 check'
description: >-
  Lint ISO 20022 messages and check them against a scheme rule profile, then
  upload the findings to GitHub code scanning. Needs no ISO 20022 download:
  linting and the rule profiles run from AskISO's embedded index.
author: 'Sebastien Rousseau'

branding:
  # Marketplace accepts Feather icon names only; a custom mark is refused.
  icon: 'check-circle'
  color: 'blue'

inputs:
  path:
    description: 'File, directory or glob to check.'
    required: false
    default: '.'
  profile:
    description: >-
      Scheme rule profile to apply. cbpr-plus checks the live SR2025 message
      definitions, Usage Identifiers, Business Application Header, formal
      cross-message rules and message variants. Use cbpr-2026 explicitly for
      deferred structured-address readiness. Empty applies none.
    required: false
    default: 'cbpr-plus'
  version:
    description: 'AskISO version to install, or "latest".'
    required: false
    default: 'latest'
  sarif-file:
    description: 'Where to write the SARIF report.'
    required: false
    default: 'askiso.sarif'
  upload-sarif:
    description: >-
      Upload the report to GitHub code scanning, so a pull request that
      introduces a non-compliant message is annotated rather than merged
      silently. Needs security-events: write.
    required: false
    default: 'true'
  fail-on-error:
    description: 'Fail the job when any message has an error.'
    required: false
    default: 'true'

outputs:
  sarif-file:
    description: 'Path to the SARIF report that was written.'
    value: ${{ inputs.sarif-file }}
  failed:
    description: 'Number of messages with at least one error.'
    value: ${{ steps.check.outputs.failed }}

runs:
  using: composite
  steps:
    - name: Install AskISO
      shell: bash
      env:
        ASKISO_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ "$ASKISO_VERSION" = "latest" ]; then
          go install github.com/sebastienrousseau/askiso/cmd/askiso@latest
        else
          go install "github.com/sebastienrousseau/askiso/cmd/askiso@${ASKISO_VERSION}"
        fi
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Check messages
      id: check
      shell: bash
      env:
        ASKISO_PATH: ${{ inputs.path }}
        ASKISO_PROFILE: ${{ inputs.profile }}
        ASKISO_SARIF: ${{ inputs.sarif-file }}
        ASKISO_FAIL: ${{ inputs.fail-on-error }}
      run: |
        set -uo pipefail

        args=("$ASKISO_PATH")
        if [ -n "$ASKISO_PROFILE" ]; then
          args+=(--profile "$ASKISO_PROFILE")
        fi

        # The SARIF report is written whatever the verdict; it is the thing the
        # upload step needs, and an empty run still has to produce a valid file.
        askiso batch "${args[@]}" --format sarif > "$ASKISO_SARIF"
        sarif_status=$?

        # The human-readable run is what shows up in the job log.
        askiso batch "${args[@]}"
        status=$?

        failed="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(len({r.get("locations", [{}])[0].get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "") for run in d.get("runs", []) for r in run.get("results", []) if r.get("level") == "error"}))' "$ASKISO_SARIF")"
        echo "failed=$failed" >> "$GITHUB_OUTPUT"

        if [ "$sarif_status" -ne 0 ] && [ ! -s "$ASKISO_SARIF" ]; then
          echo "::error::askiso could not produce a SARIF report"
          exit 1
        fi
        if [ "$ASKISO_FAIL" = "true" ] && [ "$status" -ne 0 ]; then
          exit "$status"
        fi
        exit 0

    - name: Upload to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: askiso
