version: 2

project_name: askiso

before:
  hooks:
    - go mod tidy

builds:
  - id: askiso
    main: ./cmd/askiso
    binary: askiso
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/sebastienrousseau/askiso/internal/tui.Version={{ .Version }}

  # The Model Context Protocol server ships alongside the CLI. It is a separate
  # binary because an MCP client launches it and takes over its stdin and
  # stdout, which the CLI cannot give up.
  - id: askiso-mcp
    main: ./cmd/askiso-mcp
    binary: askiso-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

  # The language server ships alongside too, for the same reason: an editor
  # launches it and owns its stdin and stdout.
  - id: askiso-lsp
    main: ./cmd/askiso-lsp
    binary: askiso-lsp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

  - id: askiso-server
    main: ./cmd/askiso-server
    binary: askiso-server
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

# Sign and notarise the macOS executables before they are archived, with the
# Developer ID certificate and an App Store Connect API key from the release
# environment. GoReleaser uses quill for this, so the release stays on a Linux
# runner. Without MACOS_SIGN_P12 (a local snapshot) the step is skipped; the
# Release workflow refuses to run a tag without it.
#
# MACOS_SIGN_P12 holds the Developer ID Application certificate and its key
# and nothing else. Given the intermediate as well, quill numbers the chain
# from it and writes "certificate root[...]" into the designated requirement,
# which the signature then fails (0.0.7). Given the leaf alone, it completes
# the chain from Apple's certificates and writes "certificate 1[...]".
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - askiso
        - askiso-mcp
        - askiso-lsp
        - askiso-server
      sign:
        certificate: '{{ .Env.MACOS_SIGN_P12 }}'
        password: '{{ .Env.MACOS_SIGN_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.MACOS_NOTARY_ISSUER_ID }}'
        key_id: '{{ .Env.MACOS_NOTARY_KEY_ID }}'
        key: '{{ .Env.MACOS_NOTARY_KEY }}'
        wait: true
        timeout: 20m

# One archive carrying all four binaries: the CLI, the MCP server, the language
# server, and the HTTP daemon are one tool with four front ends.
archives:
  - id: askiso
    ids:
      - askiso
      - askiso-mcp
      - askiso-lsp
      - askiso-server
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README.md
      - NOTICE

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

# The release page is written by scripts/releasepage after goreleaser has
# uploaded the assets: highlights from docs/releases/<tag>.md, GitHub's
# pull-request notes, and the SHA-256 of every asset. goreleaser's own
# changelog would only be replaced, so it is not generated.
changelog:
  disable: true

# A software bill of materials per archive. Anyone running a payments tool needs
# to be able to answer what is inside it without unpacking the binary.
sboms:
  - artifacts: archive

# Keyless signing through Sigstore: no key to store, no key to leak, and the
# certificate records which workflow and which commit produced the artifact.
# Verify with:
#   cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/sebastienrousseau/askiso/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# Sigstore keyless signing over the checksum file, which transitively covers
# every artifact listed in it.
#
# cosign now defaults to the Sigstore bundle format: --output-signature and
# --output-certificate are accepted but ignored, and it writes to --bundle
# instead. Passing the old flags without --bundle made it try to create a
# bundle at the empty path and fail after every binary had already been built.
signs:
  - cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

# Linux packages. A payments team running AskISO in a pipeline installs from a
# package manager, not by unpacking a tarball into /usr/local/bin.
nfpms:
  - id: askiso
    package_name: askiso
    vendor: Sebastien Rousseau
    homepage: https://askiso.io
    maintainer: Sebastien Rousseau <sebastian.rousseau@gmail.com>
    description: |-
      ISO 20022 reference tooling.
      Search, lint, validate, generate and convert ISO 20022 financial messages,
      and translate SWIFT MT messages to their ISO 20022 equivalents. Ships no
      specification content: schemas come from your own download from
      iso20022.org.
    license: Apache-2.0 OR MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    contents:
      - src: LICENSE-APACHE
        dst: /usr/share/doc/askiso/LICENSE-APACHE
      - src: LICENSE-MIT
        dst: /usr/share/doc/askiso/LICENSE-MIT
      - src: README.md
        dst: /usr/share/doc/askiso/README.md

# Homebrew and Scoop are published by their own repositories
# (sebastienrousseau/homebrew-tap and sebastienrousseau/scoop-bucket), whose
# bump workflows read each release's checksums.txt. Their main branches take
# only signed commits through pull requests, which a push from here could not
# satisfy.

# The title is "askiso <version>", never the bare tag (AGENTS.md §3). The
# body goreleaser writes is a placeholder: scripts/releasepage replaces it
# with the portfolio layout once every asset is uploaded, and reads it back.
release:
  prerelease: auto
  name_template: '{{ .ProjectName }} {{ .Version }}'
