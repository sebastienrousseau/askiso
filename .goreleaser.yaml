version: 2

project_name: askiso

before:
  hooks:
    - go mod tidy

builds:
  - id: askiso
    main: ./cmd/askiso
    binary: askiso
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/sebastienrousseau/askiso/internal/tui.Version={{ .Version }}

  # The Model Context Protocol server ships alongside the CLI. It is a separate
  # binary because an MCP client launches it and takes over its stdin and
  # stdout, which the CLI cannot give up.
  - id: askiso-mcp
    main: ./cmd/askiso-mcp
    binary: askiso-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

  # The language server ships alongside too, for the same reason: an editor
  # launches it and owns its stdin and stdout.
  - id: askiso-lsp
    main: ./cmd/askiso-lsp
    binary: askiso-lsp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

# One archive carrying all three binaries: the CLI, the MCP server and the
# language server are one tool with three front ends, and shipping them apart
# would leave someone with a client pointing at a binary they do not have.
archives:
  - id: askiso
    ids:
      - askiso
      - askiso-mcp
      - askiso-lsp
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README.md
      - NOTICE

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

# The release page is written by scripts/releasepage after goreleaser has
# uploaded the assets: highlights from docs/releases/<tag>.md, GitHub's
# pull-request notes, and the SHA-256 of every asset. goreleaser's own
# changelog would only be replaced, so it is not generated.
changelog:
  disable: true

# A software bill of materials per archive. Anyone running a payments tool needs
# to be able to answer what is inside it without unpacking the binary.
sboms:
  - artifacts: archive

# Keyless signing through Sigstore: no key to store, no key to leak, and the
# certificate records which workflow and which commit produced the artifact.
# Verify with:
#   cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/sebastienrousseau/askiso/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# Sigstore keyless signing over the checksum file, which transitively covers
# every artifact listed in it.
#
# cosign now defaults to the Sigstore bundle format: --output-signature and
# --output-certificate are accepted but ignored, and it writes to --bundle
# instead. Passing the old flags without --bundle made it try to create a
# bundle at the empty path and fail after every binary had already been built.
signs:
  - cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

# Linux packages. A payments team running AskISO in a pipeline installs from a
# package manager, not by unpacking a tarball into /usr/local/bin.
nfpms:
  - id: askiso
    package_name: askiso
    vendor: Sebastien Rousseau
    homepage: https://askiso.io
    maintainer: Sebastien Rousseau <sebastian.rousseau@gmail.com>
    description: |-
      ISO 20022 reference tooling.
      Search, lint, validate, generate and convert ISO 20022 financial messages,
      and translate SWIFT MT messages to their ISO 20022 equivalents. Ships no
      specification content: schemas come from your own download from
      iso20022.org.
    license: Apache-2.0 OR MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    contents:
      - src: LICENSE-APACHE
        dst: /usr/share/doc/askiso/LICENSE-APACHE
      - src: LICENSE-MIT
        dst: /usr/share/doc/askiso/LICENSE-MIT
      - src: README.md
        dst: /usr/share/doc/askiso/README.md

# homebrew_casks replaces the deprecated brews section: Homebrew now expects a
# binary distribution to be a cask rather than a formula.
homebrew_casks:
  - name: askiso
    # Publishing to the tap needs a token for a different repository, which the
    # default GITHUB_TOKEN cannot provide. Without it the cask is built and
    # attached to the release but not pushed, so a release still succeeds on a
    # repository that has not been given one -- rather than failing after the
    # binaries were already produced.
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_TOKEN "" }}true{{ else }}false{{ end }}'
    repository:
      owner: sebastienrousseau
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    homepage: https://askiso.io
    description: ISO 20022 reference tooling for the terminal, an editor, and an AI assistant
    binaries:
      - askiso
      - askiso-mcp
      - askiso-lsp
    caveats: |
      AskISO ships no ISO 20022 specification content. Download the message sets
      you need from https://www.iso20022.org/ then:

        askiso catalog add <downloaded.zip>

      Search, lint, generate and MT translation work without any download.

scoops:
  - name: askiso
    # Same reasoning as the cask above.
    skip_upload: '{{ if eq .Env.SCOOP_BUCKET_TOKEN "" }}true{{ else }}false{{ end }}'
    repository:
      owner: sebastienrousseau
      name: scoop-bucket
      token: '{{ .Env.SCOOP_BUCKET_TOKEN }}'
    homepage: https://askiso.io
    description: ISO 20022 reference tooling for the terminal, an editor, and an AI assistant
    license: Apache-2.0 OR MIT

# The title is "askiso <version>", never the bare tag (AGENTS.md §3). The
# body goreleaser writes is a placeholder: scripts/releasepage replaces it
# with the portfolio layout once every asset is uploaded, and reads it back.
release:
  prerelease: auto
  name_template: '{{ .ProjectName }} {{ .Version }}'
