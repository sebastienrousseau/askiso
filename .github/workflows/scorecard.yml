#
# OpenSSF Scorecard: the supply-chain self-assessment behind the README's
# Scorecard badge. It runs weekly and on every push to main, publishes the
# score to api.securityscorecards.dev (which the badge reads), and uploads
# its findings to code scanning.

name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions: {}

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The authoritative runs are push-to-main and the weekly schedule; on a
    # pull request nothing is published, so a PR run is advisory.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
