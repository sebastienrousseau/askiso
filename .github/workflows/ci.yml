#
# Actions are pinned by commit SHA (OpenSSF Scorecard "Pinned-Dependencies").
# The trailing comment records the tag each SHA corresponds to.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the `go` directive in go.mod, patch release included.
  # GOTOOLCHAIN is local, so a bare '1.26' resolves to whatever patch the runner
  # image happens to ship and cannot satisfy a go.mod requiring a newer one.
  GO_VERSION: '1.26.6'
  COVERAGE_FLOOR: '97.5'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -s -l cmd/ internal/ pkg/ scripts/ web/)"
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files (run 'make fmt'):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: latest

  test:
    name: Test (${{ matrix.os }}, go${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 1.26.6 is the floor, not a preference: it carries the standard library
        # fixes for GO-2026-6218/6090/6089/6088/5972/5026 that go.mod requires.
        # An older release cannot build the module, and testing on one would
        # exercise a standard library AskISO does not ship against.
        go: ['1.26.6']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Test with race detector
        run: go test -race ./...

      - name: Measure coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.6'
        # Race detection and whole-repository instrumentation are deliberately
        # separate. Combining them makes each test binary instrument every
        # package under the race detector, which can exceed Go's test timeout
        # and leave a misleadingly incomplete coverage profile.
        shell: bash
        # The examples are excluded from the coverage denominator, and only
        # from it: they are demonstration mains proven by examples_test
        # building and running each one, which statement coverage cannot see
        # across a subprocess. This must stay in step with COVERPKG in the
        # Makefile — they were out of step once, and CI failed on a floor the
        # local build had already satisfied.
        run: |
          coverpkg="$(go list ./... | grep -v '/examples' | paste -sd, -)"
          go test -coverpkg="$coverpkg" -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build
        run: |
          go build -o askiso ./cmd/askiso
          go build -o askiso-mcp ./cmd/askiso-mcp
          go build -o askiso-lsp ./cmd/askiso-lsp

      # The MCP transport is easy to break in ways unit tests on the server
      # object do not notice -- a stray line on stdout corrupts the stream, and
      # the handshake has to complete before tools can be listed. This drives
      # the real binary the way a client does.
      - name: MCP handshake
        if: runner.os != 'Windows'
        shell: bash
        run: |
          out="$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./askiso-mcp 2>/dev/null)"
          echo "$out"
          lines="$(printf '%s\n' "$out" | wc -l | tr -d ' ')"
          if [ "$lines" -ne 2 ]; then
            echo "::error::expected exactly two replies on stdout, got $lines"
            exit 1
          fi
          case "$out" in
            *'"askiso_translate"'*) ;;
            *) echo "::error::tools/list did not return the tool set"; exit 1 ;;
          esac

      # AskISO no longer ships the ISO 20022 catalogue, so a clean runner has
      # none. Two properties must hold, and both have regressed before:
      #   1. Commands needing the XSDs fail loudly instead of printing nothing.
      #   2. Discovery still works from the embedded registry, so a fresh
      #      install is never inert.
      - name: Behaviour with no catalogue installed
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          schema_out="$(./askiso schema pacs.008.001.10 2>&1)"; schema_code=$?
          search_out="$(./askiso search pacs.008 2>&1)"; search_code=$?
          set -e

          echo "--- schema (expect failure) ---"; echo "$schema_out"
          if [ "$schema_code" -eq 0 ]; then
            echo "::error::schema exited 0 with no catalogue installed"
            exit 1
          fi
          case "$schema_out" in
            *iso20022.org*) ;;
            *) echo "::error::the error must point users at iso20022.org"; exit 1 ;;
          esac

          echo "--- search (expect registry fallback) ---"; echo "$search_out"
          if [ "$search_code" -ne 0 ]; then
            echo "::error::search should fall back to the embedded registry"
            exit 1
          fi
          case "$search_out" in
            *pacs.008.001.10*) ;;
            *) echo "::error::registry fallback did not return known messages"; exit 1 ;;
          esac

      # The LSP transport frames messages with headers rather than newlines. A
      # framing bug looks like the server hanging rather than failing, so it has
      # to be driven the way an editor drives it.
      - name: LSP handshake
        if: runner.os != 'Windows'
        shell: bash
        run: |
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"capabilities":{}}}'
          exit_body='{"jsonrpc":"2.0","method":"exit"}'
          out="$( { printf 'Content-Length: %d\r\n\r\n%s' "${#body}" "$body"
                    printf 'Content-Length: %d\r\n\r\n%s' "${#exit_body}" "$exit_body"
                  } | ./askiso-lsp 2>/dev/null )"
          echo "$out"
          case "$out" in
            *hoverProvider*) ;;
            *) echo "::error::the language server did not advertise its capabilities"; exit 1 ;;
          esac

      - name: Enforce coverage floor
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.6'
        shell: bash
        run: |
          pct="$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')"
          echo "Total coverage: ${pct}%  (floor ${COVERAGE_FLOOR}%)"
          awk -v p="$pct" -v f="$COVERAGE_FLOOR" \
            'BEGIN { if (p+0 < f+0) { print "::error::coverage " p "% is below floor " f "%"; exit 1 } }'

  reliability:
    name: Fuzz, model and sanitizer verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Race-hostile concurrency repetitions
        run: |
          go test -race -count=25 -timeout=10m \
            ./internal/atomicfile ./internal/lsp ./internal/mcp ./internal/catalog ./internal/codes ./internal/mock ./internal/rules
          go test -race -count=10 -timeout=10m ./internal/cbprworkspace \
            -run '^Test(WorkspaceRefreshIsOneSnapshotForConcurrentReaders|WorkspacePublicationAcrossProcesses|FailedActivationRetainsPreviousGeneration|GenerationInventoryAndRollback|PruneGenerationsRequiresConfirmationAndRetainsActive|GenerationInventoryIgnoresCrashStagingDirectory)$'

      - name: State-machine model exploration
        run: |
          go test ./internal/lsp -run '^TestProtocolStateMachineMatchesOracle$' -rapid.checks=10000
          go test ./internal/mcp -run '^TestProtocolStateMachineMatchesOracle$' -rapid.checks=10000
          go test ./internal/cbprworkspace -run '^TestGenerationStateMachineMatchesOracle$' -rapid.checks=250

      - name: Native fuzz smoke campaign
        run: |
          go test ./internal/xsd       -run '^$' -fuzz '^FuzzParse$' -fuzztime 15s -parallel 4
          go test ./internal/xsd       -run '^$' -fuzz '^FuzzStructuredSchema$' -fuzztime 15s -parallel 4
          go test ./internal/validator -run '^$' -fuzz '^FuzzValidate$' -fuzztime 15s -parallel 4
          go test ./internal/validator -run '^$' -fuzz '^FuzzStructuredValidation$' -fuzztime 15s -parallel 4
          go test ./internal/swift     -run '^$' -fuzz '^FuzzParse$' -fuzztime 15s -parallel 4
          go test ./internal/swift     -run '^$' -fuzz '^FuzzStructuredMT103$' -fuzztime 15s -parallel 4
          go test ./internal/converter -run '^$' -fuzz '^FuzzRoundTrip$' -fuzztime 15s -parallel 4
          go test ./internal/converter -run '^$' -fuzz '^FuzzStructuredRoundTrip$' -fuzztime 15s -parallel 4
          go test ./internal/lsp       -run '^$' -fuzz '^FuzzConnFrameRoundTrip$' -fuzztime 15s -parallel 4
          go test ./internal/rules     -run '^$' -fuzz '^FuzzCBPRPackMergeAlgebra$' -fuzztime 15s -parallel 4
          go test ./internal/codes     -run '^$' -fuzz '^FuzzExternalJSONSemanticShapes$' -fuzztime 15s -parallel 4
          go test ./internal/cbprworkspace -run '^$' -fuzz '^FuzzWorkspaceMetadataRoundTrip$' -fuzztime 15s -parallel 4

      - name: Aggressive pointer checking
        run: go test -gcflags=all=-d=checkptr=2 -timeout 20m ./...

      # Race, ASan and MSan are distinct compiler modes and cannot be combined.
      - name: AddressSanitizer
        run: CGO_ENABLED=1 go test -asan -timeout 20m ./...

      - name: MemorySanitizer
        run: CGO_ENABLED=1 CC=clang go test -msan -timeout 20m ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      # Keep static taint findings visible without turning intentional
      # user-selected paths, configured endpoints, and example inputs into a
      # false release blocker. Findings are triaged as CodeQL alerts.
      - name: gosec SARIF
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
          gosec -fmt sarif -out gosec.sarif ./...
      - uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        if: always()
        with:
          sarif_file: gosec.sarif

      - uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: go
      - uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
