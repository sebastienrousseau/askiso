#
# Actions are pinned by commit SHA (OpenSSF Scorecard "Pinned-Dependencies").
# The trailing comment records the tag each SHA corresponds to.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # Pin the patch release so shipped binaries carry the patched standard
  # library rather than whatever the runner image happens to ship.
  GO_VERSION: '1.26.11'

jobs:
  # The gate runs again against the tag. A release that was never proven green
  # at the exact commit it ships is a release nobody can trust.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Delegated to the Makefile so the floor and the package list have one
      # definition. This step had its own copy of both, and drifted: it still
      # enforced a stale floor after the main gate moved, and it counted packages the
      # Makefile had already excluded.
      # The release page's highlights are the one hand-written part of it
      # (AGENTS.md §3). A tag without them would build and upload everything
      # and then fail at the page, so they are checked before anything is
      # built.
      - name: Release highlights exist
        run: test -s "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Test with the coverage floor
        run: make cover

      - name: Protocol handshakes
        run: |
          go build -o askiso-mcp ./cmd/askiso-mcp
          go build -o askiso-lsp ./cmd/askiso-lsp

          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./askiso-mcp | grep -q '"askiso_translate"'

          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"capabilities":{}}}'
          bye='{"jsonrpc":"2.0","method":"exit"}'
          { printf 'Content-Length: %d\r\n\r\n%s' "${#body}" "$body"
            printf 'Content-Length: %d\r\n\r\n%s' "${#bye}" "$bye"
          } | ./askiso-lsp | grep -q 'hoverProvider'

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    # The Apple signing certificate and notary key are secrets of this
    # environment, not of the repository, so only this job can read them.
    environment: release
    permissions:
      contents: write
      # Sigstore signs keylessly against the workflow's own OIDC identity, so
      # there is no key to store and the certificate records what produced the
      # artifact.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # goreleaser skips notarisation when the certificate is absent, which
      # is right for a local snapshot and wrong for a release: macOS would
      # quarantine and refuse the binaries. A tag without the secrets stops
      # here, before anything is built or published.
      - name: Signing secrets are present
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=0
          for v in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set in the release environment"; missing=1; fi
          done
          exit "$missing"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # An exact release, not a range: this job holds the Apple signing
          # certificate, so a new goreleaser runs here only after a reviewed
          # bump.
          version: 'v2.20.2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      # Build provenance, so a consumer can prove an artifact came from this
      # repository at this commit rather than from someone's laptop.
      # subject-checksums attests every artifact listed in the file, so each
      # archive and package can be verified on its own. subject-path attested
      # only checksums.txt itself, and `gh attestation verify <archive>` found
      # nothing (0.0.6 and earlier).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: 'dist/checksums.txt'

      # goreleaser names the release and uploads the assets; this writes the
      # page in the portfolio layout: the highlights from
      # docs/releases/<tag>.md, GitHub's pull-request notes, the SHA-256 of
      # every asset as uploaded, and the Full Changelog link. It reads the
      # page back and fails unless GitHub shows exactly what was composed.
      - name: Publish the release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./scripts/releasepage -name askiso -tag "${GITHUB_REF_NAME}" -publish

  # Proves on a Mac what a user's Mac will check: every published macOS binary
  # carries a Developer ID signature with the hardened runtime that satisfies
  # its own designated requirement, Apple has notarised it, and it runs.
  verify-macos:
    name: Verify macOS signatures
    needs: release
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Signed, notarised and runnable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          cd "$RUNNER_TEMP"
          for arch in amd64 arm64; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "askiso_${version}_darwin_${arch}.tar.gz"
            mkdir "$arch"
            tar -xzf "askiso_${version}_darwin_${arch}.tar.gz" -C "$arch"
            for b in askiso askiso-mcp askiso-lsp askiso-server; do
              codesign -d -r- "$arch/$b" 2>&1 | grep '^designated'
              # Also checks the designated requirement, but only with
              # --verbose: without it codesign exits 0 on a binary that fails
              # it. 0.0.7 passed every other line here and failed this one.
              codesign --verify --strict --verbose=2 "$arch/$b"
              codesign -dvv "$arch/$b" 2>&1 | grep -q '^Authority=Developer ID Application:'
              codesign -dvv "$arch/$b" 2>&1 | grep -q 'flags=.*runtime'
              # Asks Apple whether the binary is notarised. spctl cannot: for
              # a bare command-line binary it answers "does not seem to be an
              # app" whatever the signature.
              codesign --verify --check-notarization -R=notarized "$arch/$b"
              echo "ok $arch/$b"
            done
          done
          for b in askiso-mcp askiso-lsp askiso-server; do
            "arm64/$b" -version | grep -qx "$b $version"
          done
