#
# Actions are pinned by commit SHA (OpenSSF Scorecard "Pinned-Dependencies").
# The trailing comment records the tag each SHA corresponds to.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # Pin the patch release so shipped binaries carry the patched standard
  # library rather than whatever the runner image happens to ship.
  GO_VERSION: '1.26.10'

jobs:
  # The gate runs again against the tag. A release that was never proven green
  # at the exact commit it ships is a release nobody can trust.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Delegated to the Makefile so the floor and the package list have one
      # definition. This step had its own copy of both, and drifted: it still
      # enforced a stale floor after the main gate moved, and it counted packages the
      # Makefile had already excluded.
      # The release page's highlights are the one hand-written part of it
      # (AGENTS.md §3). A tag without them would build and upload everything
      # and then fail at the page, so they are checked before anything is
      # built.
      - name: Release highlights exist
        run: test -s "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Test with the coverage floor
        run: make cover

      - name: Protocol handshakes
        run: |
          go build -o askiso-mcp ./cmd/askiso-mcp
          go build -o askiso-lsp ./cmd/askiso-lsp

          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./askiso-mcp | grep -q '"askiso_translate"'

          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"capabilities":{}}}'
          bye='{"jsonrpc":"2.0","method":"exit"}'
          { printf 'Content-Length: %d\r\n\r\n%s' "${#body}" "$body"
            printf 'Content-Length: %d\r\n\r\n%s' "${#bye}" "$bye"
          } | ./askiso-lsp | grep -q 'hoverProvider'

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sigstore signs keylessly against the workflow's own OIDC identity, so
      # there is no key to store and the certificate records what produced the
      # artifact.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      # Build provenance, so a consumer can prove an artifact came from this
      # repository at this commit rather than from someone's laptop.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/checksums.txt'

      # goreleaser names the release and uploads the assets; this writes the
      # page in the portfolio layout: the highlights from
      # docs/releases/<tag>.md, GitHub's pull-request notes, the SHA-256 of
      # every asset as uploaded, and the Full Changelog link. It reads the
      # page back and fails unless GitHub shows exactly what was composed.
      - name: Publish the release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./scripts/releasepage -name askiso -tag "${GITHUB_REF_NAME}" -publish
