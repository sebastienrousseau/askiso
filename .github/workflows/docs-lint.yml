#
# Prose gates for the repository's own documents: the README's layout and
# the Markdown rules in .markdownlint-cli2.jsonc. The website's pages are
# checked by the Website workflow instead. Neither of these breaks any other
# job, which is why they need one of their own: a standard that is not a CI
# gate decays.

name: Docs Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    name: README template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: The README follows the portfolio template
        run: scripts/readme-check.sh

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The globs and ignores are the config file's, so a local
      # `npx markdownlint-cli2` checks exactly what CI checks.
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
