#
# Builds the website and publishes it to GitHub Pages.
#
# The site is pkg/iso20022 compiled to WebAssembly, so the browser runs the same
# engine as the CLI. It ships no ISO 20022 specification content -- only the
# embedded index of what exists and where the Registration Authority hosts it.

name: Website

on:
  push:
    branches: [main]
    # A release republishes the site, so the version the footer names always
    # matches the newest release rather than whatever main happened to be when
    # it last built.
    #
    # The trigger is the tag, not the release. goreleaser creates the release
    # with the default GITHUB_TOKEN, and GitHub does not raise workflow events
    # for actions taken with that token -- so `release: published` never fires
    # for a release this repository publishes itself. Pushing the tag is a user
    # action and does fire, which is how the Release workflow is triggered in
    # the first place.
    tags: ['v*']
  # Kept for a release published by hand, where the event does fire.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # Every browser gate skips when Chrome or puppeteer is missing, which is
    # right on a laptop and wrong here: a dependency that failed to install
    # would turn all of them into silent passes. This makes them refuse.
    env:
      ASKISO_REQUIRE_BROWSER: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags are needed to work out which release the site reflects.
          fetch-depth: 0

      # The site states its version in the footer. On a release build that is
      # the tag being published; on a push to main it is the newest tag that
      # already exists, so the site never claims a version that was not cut.
      - name: Resolve the release version
        id: version
        run: |
          case "${{ github.event_name }}" in
            release) v="${{ github.event.release.tag_name }}" ;;
            push)
              # On a tag push github.ref_name is the tag itself; on a branch
              # push it is the branch, so fall back to the newest tag.
              case "${{ github.ref }}" in
                refs/tags/*) v="${{ github.ref_name }}" ;;
                *) v="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)" ;;
              esac
              ;;
            *) v="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)" ;;
          esac
          echo "value=${v#v}" >> "$GITHUB_OUTPUT"
          echo "building the site as ${v}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      # The content half of the site is built by ssg, which is a Rust binary.
      # Installing it from crates.io is a couple of minutes on a cold cache and
      # near-instant on a warm one, which is why the cargo registry is cached.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
          key: cargo-ssg-${{ runner.os }}-0.0.71

      - name: Install ssg
        run: command -v ssg || cargo install ssg --version 0.0.71 --locked

      # The terminal sessions on the site are replayed against the binary
      # before it is published. A reworded diagnostic or a renamed flag should
      # fail the deploy, not quietly leave the site showing output the tool
      # stopped producing months ago.
      - name: Verify the terminal sessions against the binary
        run: make sessions

      - name: Build the site
        run: make web VERSION="${{ steps.version.outputs.value }}"

      # The site is only as trustworthy as the bridge between Go and JavaScript.
      # A renamed API or a field that stops serialising would break the page
      # silently, so the smoke test gates the deploy.
      - name: Smoke-test the bundle
        run: node web/wasm/smoke_test.mjs

      # Readability is a property of the published pages, so it is checked on
      # the built output rather than on the sources.
      - name: Check readability
        run: make readability

      - name: Check search metadata
        run: make seo

      # Drives the two interactive pages the way a visitor does. The engine
      # loads on first interaction now, and an action taken while it is still
      # arriving has to be queued and replayed -- a failure mode no static check
      # sees, and one that shipped once.
      - name: Drive the interactive pages
        run: |
          npm install --no-save puppeteer-core@23 axe-core@4
          make web-interact
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # WCAG 2.2 AA in a rendered page, both themes. The generator's checker
      # reads the markup; contrast and focus order only exist once the cascade
      # has resolved, and this is what WAVE and the other auditors are built on.
      - name: Audit WCAG 2.2 AA with axe-core
        run: make a11y-axe
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # The contrast axe will not rule on. Where a banner sets text over a
      # photograph behind a gradient scrim it cannot resolve the background and
      # defers; this measures it from the rendered pixels instead.
      - name: Measure banner contrast from the pixels
        run: make banner-contrast
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # WCAG 1.4.10: nothing may scroll sideways at 320 CSS pixels, which is
      # 1280 at 400% zoom. axe renders at 1280, where reflow cannot fail.
      - name: Check reflow at phone widths
        run: make reflow
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # A shell block and the terminal it becomes must have the same box, or
      # every paragraph below them moves when the script runs.
      - name: Check the terminal swap moves nothing
        run: make terminal-swap
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # WCAG 2.4.3: what is painted first must not be reached last. No checker
      # reports this — focus order is not decidable from markup alone.
      - name: Check focus order against what is painted
        run: make focus-order
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # Anything the browser complains about, on every page.
      - name: Check the browser console
        run: make web-console
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # The premise of the project is that it redistributes no specification
      # content. This is the gate that keeps that true rather than aspirational.
      - name: Verify no specification content is being published
        run: |
          if find web/public -name '*.xsd' -o -name '*.pdf' -o -name '*.docx' | grep -q .; then
            echo "::error::the site must not ship ISO 20022 specification content"
            find web/public -name '*.xsd' -o -name '*.pdf' -o -name '*.docx'
            exit 1
          fi
          echo "site contents:"; ls -lha web/public

      # These are the files that make the site discoverable to an assistant
      # rather than only to a person, and they live under a dot directory that
      # is easy to lose between the build and the deployed artefact. Assert
      # them here so the loss is a build failure rather than a quiet 404.
      - name: Verify agentic discovery files are present
        run: |
          for f in .nojekyll .well-known/mcp.json .well-known/ai-plugin.json mcp.json ai-plugin.json agents.txt; do
            if [ -e "web/public/$f" ]; then
              echo "ok      $f"
            else
              echo "::error::missing $f"; exit 1
            fi
          done

      # 2,845 of the pages are the message definitions, and they are the reason
      # the site is discoverable at all. An empty sitemap published them to
      # nobody, which is exactly the kind of failure that looks like success.
      # Compares the two sets rather than their sizes: a page dropped and a
      # page wrongly added cancel out in a count, and a count cannot express
      # the one page that is deliberately absent.
      - name: Verify the sitemap lists every page
        run: make sitemap-check

      # A dead reference in a shared layout is dead on every page, and a static
      # site has no runtime to notice. This caught six such targets across all
      # 2,850 pages at once.
      - name: Verify every internal link resolves
        run: make links

      # ssg runs an accessibility pass over every page it builds. Failing the
      # deploy on it is what stops the WCAG 2.2 AA claim drifting out of date.
      - name: Enforce the accessibility gate
        run: |
          issues="$(python3 -c 'import json;print(json.load(open("web/public/accessibility-report.json"))["total_issues"])')"
          echo "WCAG 2.2 issues: $issues"
          [ "$issues" = "0" ] || { echo "::error::accessibility gate failed"; exit 1; }

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
