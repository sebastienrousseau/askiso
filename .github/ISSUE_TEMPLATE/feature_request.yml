name: Feature request
description: A message, check or answer AskISO should give you
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do with an ISO 20022 message that AskISO makes hard or impossible? Describe the situation, not the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like AskISO to do
      description: The command, flag or answer you would expect, and its output.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: Another tool, a script, or reading the specification by hand.

  - type: checkboxes
    id: checks
    attributes:
      label: Before opening
      options:
        - label: I have checked this is not already possible with an existing command (`askiso --help`)
          required: true
