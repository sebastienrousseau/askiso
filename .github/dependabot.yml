#
# Version updates for the Go module and the pinned workflow actions. A
# Dependabot pull request is not merged into main on its own: its commit is
# folded into the open feat/v<next> release branch (AGENTS.md §3). The
# cooldown matches the seven-day minimum release age the toolchain uses.

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
